- name: Common tool setup on all the servers
  hosts: appsrvgrp
  become: yes
  vars:
    tom_url: https://archive.apache.org/dist/tomcat/tomcat-8/v8.5.37/bin/apache-tomcat-8.5.37.tar.gz
    jdk25_arch: "{{ 'aarch64' if ansible_architecture == 'aarch64' else 'x64' }}"

  tasks:
    - name: Verify the host supports Java 25
      assert:
        that:
          - (ansible_distribution == 'Ubuntu' and ansible_distribution_major_version | int >= 20) or (ansible_distribution in ['CentOS', 'Rocky', 'AlmaLinux'] and ansible_distribution_major_version | int >= 8)
          - ansible_architecture in ['x86_64', 'aarch64']
        fail_msg: "Java 25 deployment requires Ubuntu 20+, CentOS/Rocky/AlmaLinux 8+, and x86_64 or aarch64."

    - name: Download Temurin JDK 25
      get_url:
        url: "https://api.adoptium.net/v3/binary/latest/25/ga/linux/{{jdk25_arch}}/jdk/hotspot/normal/eclipse"
        dest: /tmp/temurin-jdk-25.tar.gz
        mode: "0644"

    - name: Install Temurin JDK 25
      unarchive:
        src: /tmp/temurin-jdk-25.tar.gz
        dest: /opt/java-25
        remote_src: yes
        extra_opts:
          - --strip-components=1
        creates: /opt/java-25/bin/java

    - name: Download Tomcat Tar Ball/Binaries
      get_url:
        url: "{{tom_url}}"
        dest: /tmp/tomcat-8.tar.gz

    - name: Add tomcat group
      group:
        name: tomcat
        state: present

    - name: Add tomcat user
      user:
        name: tomcat
        group: tomcat
        shell: /bin/nologin
        home: /usr/local/tomcat8

    - file:
        path: /tmp/tomcat8
        state: directory

    - name: Extract tomcat
      unarchive:
        src: /tmp/tomcat-8.tar.gz
        dest: /tmp/tomcat8/
        remote_src: yes
        list_files: yes
      register: unarchive_info

    - debug:
        msg: "{{unarchive_info.files[0].split('/')[0]}}"

    - name: Synchronize /tmp/tomcat8/tomcat_cont /usr/local/tomcat8.
      synchronize:
        src: "/tmp/tomcat8/{{unarchive_info.files[0].split('/')[0]}}/"
        dest: /usr/local/tomcat8/
      delegate_to: "{{ inventory_hostname }}"

    - name: Change ownership of /usr/local/tomcat8
      file:
        path: /usr/local/tomcat8
        owner: tomcat
        group: tomcat
        recurse: yes

    - name: Setup Tomcat systemd service
      template:
         src: templates/tomcat.service.j2
         dest: /etc/systemd/system/tomcat.service
         mode: "0644"

    - name: Reload systemd configuration
      systemd:
        daemon_reload: yes 

    - name: Start and enable Tomcat
      service:
        name: tomcat
        state: started
        enabled: yes
