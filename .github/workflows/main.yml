name: Build WF
on:
  push:
   branches:
     - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

  schedule:
    - cron: "10 14 * * 1-5" # Runs at 2:00 AM UTC every day


jobs:
  Build:
    runs-on: ubuntu-latest 
    steps:
      - name: Code checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      
      - name: Maven Build
        run: mvn install

        
  Testing:
    runs-on: ubuntu-latest
    needs: Build
    steps:
      - name: Code checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run tests on main branches
        run: mvn test
      
      - name: Checkstyle
        run: mvn checkstyle:checkstyle



      
  